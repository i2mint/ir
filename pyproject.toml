[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "ir"
version = "0.1.30"
description = "An information-retrieval substrate for agentic systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "information-retrieval",
    "retrieval",
    "embeddings",
    "semantic-search",
    "agents",
    "rag",
    "search",
    "abstention",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "numpy",
    "dol",
    "ef",
    "vd",
    "argh",
]

[project.scripts]
ir = "ir.__main__:main"

[project.urls]
Homepage = "https://i2mint.github.io/ir/"
Repository = "https://github.com/i2mint/ir"
Documentation = "https://i2mint.github.io/ir"
Issues = "https://github.com/i2mint/ir/issues"
Changelog = "https://github.com/i2mint/ir/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
llm = [
    "aix",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
# Real lint rules, not just docstring presence: pyflakes (F), pycodestyle
# errors/warnings (E/W), and flake8-bugbear (B) catch genuine defects. E501
# (line length) stays off — long descriptive docstrings are a deliberate choice
# at line-length 88. Tests are excluded from linting (below) for now.
select = [
    "D100",
    "F",
    "E",
    "W",
    "B",
]
ignore = [
    "D203",
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
